name: Deploy GitHub Pages

# Publishes both websites from a single artifact:
#
#   /            → the reception site (repository root, untouched)
#   /Wedding/    → the built Vite + React invitation (Wedding/dist)
#
# The Wedding *sources* are never published — only its build output — and the
# reception site is copied byte for byte, so nothing about it can drift.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the official Pages artifact flow.
permissions:
  contents: read
  actions: read # read the branch-based Pages run, see the ordering guard below
  pages: write
  id-token: write

# One deployment at a time, and never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Wedding/package-lock.json

      - name: Install wedding dependencies
        working-directory: Wedding
        run: npm ci

      - name: Build wedding site
        working-directory: Wedding
        run: npm run build

      - name: Assemble the deployment directory
        run: |
          set -euo pipefail
          mkdir -p _site

          # Reception website: every published root file, but never the repo
          # plumbing, the wedding sources, the staging folder itself, or a
          # stray node_modules.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='Wedding/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            ./ _site/

          # Wedding website: the built output only, mounted at /Wedding/.
          mkdir -p _site/Wedding
          rsync -a Wedding/dist/ _site/Wedding/

      - name: Verify the assembled site
        run: |
          set -euo pipefail

          # 1. The reception index is the original — never the Vite one.
          cmp index.html _site/index.html

          # 2. Every reception file survived the copy untouched.
          for entry in *; do
            case "$entry" in
              Wedding|_site) continue ;;
            esac
            diff -r "$entry" "_site/$entry" >/dev/null
          done

          # 3. The wedding build is present and points at its own base path.
          test -f _site/Wedding/index.html
          test -f _site/Wedding/favicon.svg
          grep -q '/RohitandRadha/Wedding/assets/' _site/Wedding/index.html

          # 4. No Vite source or dependencies leaked into the artifact.
          test ! -e _site/Wedding/src
          test ! -e _site/Wedding/node_modules
          if grep -q '/src/main.jsx' _site/Wedding/index.html; then
            echo "The Vite dev shell leaked into the deployment." >&2
            exit 1
          fi

          echo "Assembled site is clean:"
          find _site -maxdepth 2 -mindepth 1 | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---------------------------------------------------------------------
      # Deployment ordering guard.
      #
      # GitHub also runs its branch-based Pages publisher ("pages build and
      # deployment") for this repository, and that one publishes the *raw
      # repository tree* — including the unbundled Vite shell at /Wedding/.
      # Whichever deployment lands last is the one served, so this step waits
      # for that build to finish and lets the artifact have the final word.
      #
      # The moment the repository's Pages source is set to "GitHub Actions"
      # (Settings → Pages → Build and deployment → Source), that publisher
      # stops running and this guard costs nothing.
      # ---------------------------------------------------------------------
      - name: Let the branch-based Pages build finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Give it time to appear and finish its Jekyll build.
          sleep 40

          deadline=$((SECONDS + 150))
          while [ $SECONDS -lt $deadline ]; do
            pending=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' 2>/dev/null || echo 0)

            if [ "$pending" = "0" ]; then
              echo "No branch-based Pages build is still running."
              break
            fi

            echo "Branch-based Pages build still running; waiting 5s…"
            sleep 5
          done

          # A short settle window, so this deployment is unambiguously the newest.
          sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
